syntax = "proto3";

package scanner.v1;
option go_package = "github.com/ricehub-io/proto/gen/go/scanner/v1;scannerv1";

service ScannerService {
  rpc ScanFile(ScanFileRequest) returns (ScanFileResponse);
}

message ScanFileRequest {
  string file_path = 1;
}

message ScanFileResponse {
  bool is_malicious = 1;
  repeated string reason = 2;
}
